name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o axo .
      - run: test "$(stat -c %s axo)" -le 10967000
